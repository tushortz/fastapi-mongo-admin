[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fastapi-mongo-admin"
version = "2.0.0"
description = "Django-inspired server-rendered admin for FastAPI and MongoDB"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Taiwo Kareem", email = "taiwo.kareem36@gmail.com" }]
keywords = ["fastapi", "mongodb", "admin", "django-admin", "motor", "pymongo"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Framework :: FastAPI",
    "Topic :: Database",
]
dependencies = [
    "fastapi>=0.100.0",
    "motor>=3.0.0",
    "pymongo>=4.0.0",
    "pydantic>=2.0.0,<3.0.0",
    "jinja2>=3.1.0",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
    "mongomock>=4.1.0",
    "uvicorn[standard]>=0.30.0",
    "email-validator>=2.0.0",
    "bandit>=1.9.4",
    "pysentry-rs>=0.4.6",
]

[project.urls]
Homepage = "https://github.com/tushortz/fastapi-mongo-admin"
Documentation = "https://github.com/tushortz/fastapi-mongo-admin#readme"
Repository = "https://github.com/tushortz/fastapi-mongo-admin"
Issues = "https://github.com/tushortz/fastapi-mongo-admin/issues"

[tool.hatch.build.targets.wheel]
packages = ["fastapi_mongo_admin"]

[tool.hatch.build.targets.wheel.force-include]
"fastapi_mongo_admin/templates" = "fastapi_mongo_admin/templates"
"fastapi_mongo_admin/static" = "fastapi_mongo_admin/static"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
    "mongomock>=4.1.0",
    "uvicorn[standard]>=0.30.0",
    "email-validator>=2.0.0",
    "bandit>=1.9.4",
    "pysentry-rs>=0.4.6",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
