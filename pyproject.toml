[build-system]
requires = ["hatchling>=1.30.1"]
build-backend = "hatchling.build"

[project]
name = "fastapi-mongo-admin"
version = "2.0.1"
description = "Django-inspired server-rendered admin for FastAPI and MongoDB"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Taiwo Kareem", email = "taiwo.kareem36@gmail.com" }]
keywords = ["fastapi", "mongodb", "admin", "django-admin", "motor", "pymongo"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Framework :: FastAPI",
    "Topic :: Database",
]
dependencies = [
    "fastapi>=0.136.3",
    "motor>=3.7.1",
    "pymongo>=4.17.0",
    "pydantic>=2.13.4,<3.0.0",
    "jinja2>=3.1.6",
    "python-multipart>=0.0.32",
    "pyyaml>=6.0.2",
    "openpyxl>=3.1.5",
    "tomli>=2.2.1; python_version<'3.11'",
    "tomli-w>=1.2.0",
]

[project.optional-dependencies]
docs = [
    "sphinx>=7.4,<9",
    "sphinx-rtd-theme>=2.0,<4",
]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.4.0",
    "httpx>=0.28.1",
    "ruff>=0.15.16",
    "black>=26.1.0",
    "mypy>=2.1.0",
    "mongomock>=4.3.0",
    "uvicorn[standard]>=0.49.0",
    "email-validator>=2.3.0",
    "bandit>=1.9.4",
    "pysentry-rs>=0.4.6",
]

[project.urls]
Homepage = "https://github.com/tushortz/fastapi-mongo-admin"
Documentation = "https://fastapi-mongo-admin.readthedocs.io/"
Repository = "https://github.com/tushortz/fastapi-mongo-admin"
Issues = "https://github.com/tushortz/fastapi-mongo-admin/issues"

[tool.hatch.build.targets.sdist]
exclude = [
  "/docs",
  "/example",
]

[tool.hatch.build.targets.wheel]
packages = ["fastapi_mongo_admin"]
exclude = [
  "/docs",
  "/example",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.4.0",
    "httpx>=0.28.1",
    "ruff>=0.15.16",
    "black>=26.1.0",
    "mypy>=2.1.0",
    "mongomock>=4.3.0",
    "uvicorn[standard]>=0.49.0",
    "email-validator>=2.3.0",
    "bandit>=1.9.4",
    "pysentry-rs>=0.4.6",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
